name: upstream-ops

services:
  app:
    image: ${IMAGE_REPOSITORY:-ghcr.io/ai8888-shop/upstream-ops}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    command: ["-config", "/app/data/config.yaml"]
    environment:
      TZ: Asia/Shanghai
      SERVER_PORT: 8418
      # SQLite remains the default, while DATABASE_DRIVER=postgres in .env
      # keeps a completed one-click migration active on future restarts.
      DATABASE_DRIVER: ${DATABASE_DRIVER:-sqlite}
      DATABASE_PATH: ${DATABASE_PATH:-/app/data/upstream-ops.db}
      DATABASE_HOST: ${DATABASE_HOST:-}
      # Leave this empty when no explicit port is configured so the server can
      # resolve 3306/5432 from DATABASE_DRIVER instead of forcing PostgreSQL's
      # port on a plain MySQL deployment.
      DATABASE_PORT: ${DATABASE_PORT:-}
      DATABASE_USER: ${DATABASE_USER:-}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-}
      DATABASE_NAME: ${DATABASE_NAME:-upstreamops}
      DATABASE_SSL_MODE: ${DATABASE_SSL_MODE:-disable}
      DATABASE_MAX_OPEN_CONNS: ${DATABASE_MAX_OPEN_CONNS:-20}
      DATABASE_MAX_IDLE_CONNS: ${DATABASE_MAX_IDLE_CONNS:-5}
      SERVER_MODE: ${SERVER_MODE:-release}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      APP_SECRET: ${APP_SECRET:?APP_SECRET is required, set it in .env}
      # 鉴权默认关闭。设 AUTH_ENABLED=true 时 ADMIN_PASSWORD 也必须填，否则后端启动失败。
      AUTH_ENABLED: ${AUTH_ENABLED:-false}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      AUTH_TOKEN_SECRET: ${AUTH_TOKEN_SECRET:-}
    ports:
      - "${HTTP_PORT:-8418}:8418"
    volumes:
      - ./data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8418/healthz >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - default
      - database

networks:
  database:
    name: ${DATABASE_NETWORK_NAME:-upstream-ops-database}
    external: ${DATABASE_NETWORK_EXTERNAL:-false}
